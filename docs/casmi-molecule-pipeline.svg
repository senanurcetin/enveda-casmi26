<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">CASMI 2026 mass spectrum molecule identification workflow</title><desc id="desc">Concept illustration showing spectral peaks, candidate ranking and evaluation, not actual competition predictions or measurements.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0F1829"/><stop offset="1" stop-color="#29204A"/></linearGradient><pattern id="grid" width="31" height="31" patternUnits="userSpaceOnUse"><path d="M31 0H0V31" fill="none" stroke="#C2C2E3" stroke-opacity=".09"/></pattern></defs><rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/><rect x="56" y="57" width="240" height="33" rx="17" fill="#302C54" stroke="#7263A3"/><text x="176" y="79" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#CBB9FF">CHEMINFORMATICS RESEARCH</text><text x="56" y="179" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#FFFFFF">Molecule</text><text x="56" y="251" font-family="Arial,sans-serif" font-size="62" font-weight="700" fill="#CBB9FF">Identification</text><text x="57" y="318" font-family="Arial,sans-serif" font-size="21" fill="#C2C2E3">Rank candidate structures from MS/MS</text><text x="57" y="350" font-family="Arial,sans-serif" font-size="21" fill="#C2C2E3">spectra with reproducible evaluation.</text><rect x="57" y="412" width="500" height="66" rx="18" fill="#302C54" stroke="#7263A3"/><text x="307" y="454" text-anchor="middle" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#EFFFFF">MS/MS · CANDIDATE RANKING · MRR@25</text><text x="57" y="557" font-family="Arial,sans-serif" font-size="13" letter-spacing="1.3" fill="#C2C2E3">ARCHITECTURE ILLUSTRATION  /  NOT A LIVE SCREENSHOT</text><g transform="translate(713 83)"><rect width="450" height="449" rx="26" fill="#171B34" stroke="#7263A3" stroke-width="2"/><text x="30" y="56" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.6" font-weight="700" fill="#CBB9FF">ILLUSTRATED RESEARCH PIPELINE</text><rect x="30" y="90" width="390" height="88" rx="17" fill="#302C54" stroke="#7263A3"/><rect x="48" y="113" width="8" height="42" rx="4" fill="#CBB9FF"/><text x="72" y="127" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Tandem MS spectra</text><text x="72" y="152" font-family="Arial,sans-serif" font-size="15" fill="#C2C2E3">Signal peaks and fragmentation</text><path d="M222 180v21m-7 -7 7 7 7 -7" fill="none" stroke="#CBB9FF" stroke-width="3"/><rect x="30" y="203" width="390" height="88" rx="17" fill="#302C54" stroke="#7263A3"/><rect x="48" y="226" width="8" height="42" rx="4" fill="#CBB9FF"/><text x="72" y="240" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Candidate structures</text><text x="72" y="265" font-family="Arial,sans-serif" font-size="15" fill="#C2C2E3">Feature extraction and ranking</text><path d="M222 293v21m-7 -7 7 7 7 -7" fill="none" stroke="#CBB9FF" stroke-width="3"/><rect x="30" y="316" width="390" height="88" rx="17" fill="#302C54" stroke="#7263A3"/><rect x="48" y="339" width="8" height="42" rx="4" fill="#CBB9FF"/><text x="72" y="353" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">Ranked hypotheses</text><text x="72" y="378" font-family="Arial,sans-serif" font-size="15" fill="#C2C2E3">Evaluation against competition metric</text></g></svg>