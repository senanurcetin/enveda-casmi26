name: NEXUS CASMI26 research checks

on:
  push:
    paths:
      - "site/**"
      - "reports/data_profile.json"
      - "sql/**"
      - "scripts/audit_submission.py"
      - "scripts/compare_runs.py"
      - "scripts/compare_control_runs.py"
      - "src/casmi/validate/control_alignment.py"
      - "src/casmi/validate/source_manifest.py"
      - "scripts/manifest_artifacts.py"
      - "tests/test_source_manifest_stdlib.py"
      - "scripts/profile_data.py"
      - "scripts/reconcile_bigquery_profile.py"
      - "scripts/run_validation.py"
      - "scripts/build_rank_data.py"
      - "src/casmi/validate/run_alignment.py"
      - "src/casmi/validate/spectral_controls.py"
      - "src/casmi/validate/knockout.py"
      - "src/casmi/channels/analog.py"
      - "src/casmi/channels/reference_selection.py"
      - "tests/test_d2_reference_selection.py"
      - "src/casmi/channels/prefilter.py"
      - "scripts/audit_analog_retention.py"
      - "tests/test_analog_retention_audit.py"
      - "tests/test_analog_index_knockout.py"
      - "tests/test_knockout_leakage.py"
      - "src/casmi/validate/paired_bootstrap.py"
      - "src/casmi/validate/simultaneous_ci.py"
      - "src/casmi/validate/metric.py"
      - "src/casmi/validate/ranked_slots.py"
      - "tests/test_foundations.py"
      - "src/casmi/validate/spectrum_overlap.py"
      - "scripts/render_bigquery_sql.py"
      - "tests/*_stdlib.py"
      - "tests/*_integration.py"
      - ".github/workflows/nexus-research-checks.yml"
  pull_request:
    paths:
      - "site/**"
      - "reports/data_profile.json"
      - "sql/**"
      - "scripts/audit_submission.py"
      - "scripts/compare_runs.py"
      - "scripts/compare_control_runs.py"
      - "src/casmi/validate/control_alignment.py"
      - "src/casmi/validate/source_manifest.py"
      - "scripts/manifest_artifacts.py"
      - "tests/test_source_manifest_stdlib.py"
      - "scripts/profile_data.py"
      - "scripts/reconcile_bigquery_profile.py"
      - "scripts/run_validation.py"
      - "scripts/build_rank_data.py"
      - "src/casmi/validate/run_alignment.py"
      - "src/casmi/validate/spectral_controls.py"
      - "src/casmi/validate/knockout.py"
      - "src/casmi/channels/analog.py"
      - "src/casmi/channels/reference_selection.py"
      - "tests/test_d2_reference_selection.py"
      - "src/casmi/channels/prefilter.py"
      - "scripts/audit_analog_retention.py"
      - "tests/test_analog_retention_audit.py"
      - "tests/test_analog_index_knockout.py"
      - "tests/test_knockout_leakage.py"
      - "src/casmi/validate/paired_bootstrap.py"
      - "src/casmi/validate/simultaneous_ci.py"
      - "src/casmi/validate/metric.py"
      - "src/casmi/validate/ranked_slots.py"
      - "tests/test_foundations.py"
      - "src/casmi/validate/spectrum_overlap.py"
      - "scripts/render_bigquery_sql.py"
      - "tests/*_stdlib.py"
      - "tests/*_integration.py"
      - ".github/workflows/nexus-research-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline audit, analytics, and branding smoke tests
        run: python -m unittest discover -s tests -p '*_stdlib.py' -v
      - name: Install numpy for synthetic comparisons
        run: python -m pip install numpy==2.3.5
      - name: Run paired-comparison integration checks
        run: python -m unittest discover -s tests -p '*_integration.py' -v
      - name: Validate Python syntax
        run: python -m py_compile scripts/audit_submission.py scripts/render_bigquery_sql.py scripts/compare_runs.py scripts/compare_control_runs.py scripts/manifest_artifacts.py scripts/reconcile_bigquery_profile.py scripts/run_validation.py scripts/build_rank_data.py scripts/profile_data.py src/casmi/validate/run_alignment.py src/casmi/validate/control_alignment.py src/casmi/validate/source_manifest.py src/casmi/validate/spectral_controls.py src/casmi/validate/spectrum_overlap.py src/casmi/validate/paired_bootstrap.py src/casmi/validate/simultaneous_ci.py src/casmi/validate/metric.py src/casmi/channels/analog.py src/casmi/channels/prefilter.py src/casmi/channels/reference_selection.py scripts/audit_analog_retention.py

  official-metric-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official-metric compatible chemistry stack
        run: python -m pip install numpy==2.3.5 pandas==2.3.3 rdkit==2026.3.3 pytest==9.0.2 scipy==1.16.2 numba==0.62.1
      - name: Run chemistry, tautomer and MRR rank-slot regressions
        run: python -m pytest tests/test_foundations.py tests/test_knockout_leakage.py tests/test_analog_index_knockout.py tests/test_analog_retention_audit.py tests/test_d2_reference_selection.py -q
