  workflow_dispatch:

env:
  PYTHONPATH: src

permissions:
  contents: read

jobs:
  research-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline audit, analytics, and branding smoke tests
        run: python -m unittest discover -s tests -p '*_stdlib.py' -v
      - name: Verify research ledger and deterministic notebook bundles
        run: |
          python scripts/research_evidence.py
          python scripts/build_revalidation_report.py
          python scripts/build_advanced_report.py --tables-only
          python scripts/build_coverage_report.py --tables-only
          python scripts/check_documentation_links.py
          python -m pip install nbformat==5.10.4
          python scripts/build_research_publications.py
          python scripts/build_overlap_notebook.py
          python scripts/build_revalidation_notebook.py
          python scripts/build_advanced_notebook.py
          python scripts/build_external_audit_notebook.py
          python scripts/build_gnps_audit_notebook.py
          python scripts/build_gnps_expanded_audit_notebook.py
          python scripts/build_purged_external_notebook.py
          git diff --exit-code -- reports/research_review.md reports/revalidation_review.md reports/advanced_review.md reports/candidate_loss_review.md reports/candidate_loss_budget.json kaggle/publications kaggle/audits
      - name: Install synthetic integration dependencies
        run: python -m pip install numpy==2.3.5 pandas==2.3.3 pytest==9.0.2 pyarrow==24.0.0
      - name: Run paired-comparison integration checks
        run: python -m pytest tests/*_integration.py tests/test_public_overlap_parquet.py tests/test_predictor_knockout.py tests/test_candidate_source_reconciliation.py -q
      - name: Validate exact hash-locked dependency profile
        run: python scripts/check_research_lock.py --structure-only
      - name: Validate Python syntax
        run: python -m py_compile scripts/audit_submission.py scripts/render_bigquery_sql.py scripts/compare_runs.py scripts/compare_control_runs.py scripts/manifest_artifacts.py scripts/diagnose_validation_slices.py scripts/reconcile_bigquery_profile.py scripts/run_validation.py scripts/build_rank_data.py scripts/build_store.py scripts/audit_store_integrity.py scripts/profile_data.py src/casmi/validate/run_alignment.py src/casmi/validate/control_alignment.py src/casmi/validate/source_manifest.py src/casmi/validate/error_slices.py src/casmi/validate/spectral_controls.py src/casmi/validate/spectrum_overlap.py src/casmi/spectra/store.py src/casmi/spectra/store_integrity.py src/casmi/spectra/similarity.py src/casmi/validate/paired_bootstrap.py src/casmi/validate/simultaneous_ci.py src/casmi/validate/metric.py src/casmi/channels/analog.py src/casmi/channels/prefilter.py src/casmi/channels/reference_selection.py scripts/audit_analog_retention.py

  official-metric-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official-metric compatible chemistry stack
        run: python -m pip install numpy==2.3.5 pandas==2.3.3 rdkit==2026.3.3 pytest==9.0.2 scipy==1.16.2 numba==0.62.1 pyarrow==24.0.0
      - name: Run chemistry, tautomer and MRR rank-slot regressions
        run: python -m pytest tests/test_foundations.py tests/test_knockout_leakage.py tests/test_analog_index_knockout.py tests/test_analog_retention_audit.py tests/test_d2_reference_selection.py tests/test_store_integrity.py tests/test_spectra.py tests/test_revalidation_truth.py tests/test_candidate_structure_quality.py tests/test_advanced_scaffolds.py tests/test_exact_sanity_answers.py tests/test_generated_pool_integrity.py tests/test_rank_summary_contracts.py tests/test_expanded_generation.py tests/test_cohort_bootstrap.py tests/test_external_identity_filter.py tests/test_external_study_contracts.py tests/test_external_purge.py tests/test_data_snapshot_config.py -q

  fresh-training-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU neural runtime from the official PyTorch index
        run: python -m pip install --no-deps torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned scientific contracts and neural dependencies
        run: python -m pip install torch==2.11.0 numpy==2.3.5 pandas==2.3.3 lightgbm==4.6.0 scipy==1.16.3 pytest==9.0.2
      - name: Exercise fresh fitting, padding invariance and ablation isolation
        run: python -m pytest tests/test_fresh_training_contracts.py tests/test_advanced_study_integration.py tests/test_research_lock_integration.py -q
