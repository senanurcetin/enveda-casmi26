name: NEXUS CASMI26 research checks

on:
  push:
    paths:
      - "site/**"
      - "reports/data_profile.json"
      - "sql/**"
      - "scripts/audit_submission.py"
      - "scripts/compare_runs.py"
      - "scripts/reconcile_bigquery_profile.py"
      - "scripts/run_validation.py"
      - "src/casmi/validate/run_alignment.py"
      - "scripts/render_bigquery_sql.py"
      - "tests/*_stdlib.py"
      - ".github/workflows/nexus-research-checks.yml"
  pull_request:
    paths:
      - "site/**"
      - "reports/data_profile.json"
      - "sql/**"
      - "scripts/audit_submission.py"
      - "scripts/compare_runs.py"
      - "scripts/reconcile_bigquery_profile.py"
      - "scripts/run_validation.py"
      - "src/casmi/validate/run_alignment.py"
      - "scripts/render_bigquery_sql.py"
      - "tests/*_stdlib.py"
      - ".github/workflows/nexus-research-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline audit, analytics, and branding smoke tests
        run: python -m unittest discover -s tests -p '*_stdlib.py' -v
      - name: Validate Python syntax
        run: python -m py_compile scripts/audit_submission.py scripts/render_bigquery_sql.py scripts/compare_runs.py scripts/reconcile_bigquery_profile.py scripts/run_validation.py src/casmi/validate/run_alignment.py
